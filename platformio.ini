; ESP32 Filament Station — "Cheap Yellow Display" (CYD, ESP32-2432S028) + PN532 NFC (I2C)
; LVGL 8.3 UI · MakerSpaceAPI REST · OTA updates
;
; The CYD ships in two display-driver revisions that are otherwise pin- and
; resolution-identical (see README.md) — pick the environment matching your
; board. If the screen shows garbled/inverted colors, you have the other one.

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    lovyan03/LovyanGFX@^1.1.12
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit PN532@^1.3.3
    bblanchon/ArduinoJson@^7.2.1

; Partition layout for 4 MB flash with dual OTA slots (~1.875 MB each) —
; the default "default.csv" only allocates 1.25 MB per app, too small for
; LVGL + LovyanGFX + WiFi/TLS + mbedtls HKDF.
board_build.partitions = min_spiffs.csv

; Increase loop task stack (default 8 KB is too small for LVGL + LovyanGFX + mbedtls HKDF)
board_build.cmake_extra_args = -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768

build_flags =
    ; lv_conf.h is in the project root
    -I ${PROJECT_DIR}
    -DLV_CONF_INCLUDE_SIMPLE
    ; Extended-Latin Montserrat fonts (umlauts, accented chars) — already
    ; generated into src/fonts/ by scripts/gen_fonts.sh. Re-run that script
    ; (and rebuild) if the font files are ever missing or need regenerating.
    -DLVGL_EXT_FONTS

; Uncomment for OTA updates once the device has an IP/hostname on the network
; (leave commented for the first, USB-based flash):
; upload_protocol = espota
; upload_port = esp32-filament.local
; upload_flags = --auth=your-ota-password

[env:cyd_ili9341]
; The original CYD (ESP32-2432S028R) — ILI9341 panel driver.
build_flags = ${env.build_flags}

[env:cyd_st7789]
; The "2×USB" CYD revision (sometimes sold as ESP32-2432S028R2/CYD2USB) —
; ST7789 panel driver. Same pins and resolution as the ILI9341 board.
build_flags = ${env.build_flags} -DCYD_PANEL_ST7789
