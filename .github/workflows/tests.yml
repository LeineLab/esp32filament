name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [cyd_ili9341, cyd_st7789]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # src/config.h is gitignored (holds real WiFi/API credentials, see
      # README.md) — there's nothing to flash-verify here, only to compile-
      # verify, so a placeholder is enough to prove the build itself is sound.
      - name: Create placeholder config.h for the build
        run: cp src/config.h.example src/config.h

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}
